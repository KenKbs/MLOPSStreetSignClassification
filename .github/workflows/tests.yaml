name: "Run tests"

on:
  push:
    branches: [master, main, GitHubActions]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: false # bricht lauf einer zelle ab wenn ein test failed
    strategy:
      fail-fast: false # bricht nicht ab wenn eine zelle failed
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5 # vordefinierte Action in GitHub

      - name: Setup uv
        uses: astral-sh/setup-uv@v7 # vordefinierte Action in GitHub, installiert uv
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies # lädt die duch die uv lock file definierte Umgebung
        run: |
          uv sync --dev --locked

      - name: Test with pytest
        run: |
          uv run invoke test
