# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace # trims white spaces
      - id: end-of-file-fixer # every file ends with one new line
      - id: check-yaml # checks yaml files for syntax
      - id: check-added-large-files # stopps committing of large files
      - id: check-merge-conflict # checks whether there are files containing a merge conflict string

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff-format # automatically does the ruff formatting
      - id: ruff # überprüft Code auf logische Fehler
        args: ["--fix"]
