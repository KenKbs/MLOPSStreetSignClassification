site_name: street_sign_project
site_author: Kenny_Finn
docs_dir: source

theme:
  language: en
  name: material
  features:
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["../src"]
          options:
            show_root_heading: true
            separate_signature: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - API reference:
      - Data pipeline: reference/data.md
      - Model & training: reference/models.md
      - Serving & APIs: reference/serving.md
      - Monitoring: reference/monitoring.md
      - Utilities: reference/utilities.md
