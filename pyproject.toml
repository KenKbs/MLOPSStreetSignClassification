[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "street_sign_project"
version = "0.0.1"
description = "Testing the MLOps knowledge with the example of a street sign classification task"
authors = [
  { name = "Kenny_Finn", email = "your@email.com" },
]
license = { file = "LICENSE" }
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python=">=3.12,<3.14"
dependencies = [
    "bentoml>=1.4.39",
    "dvc>=3.67.1",
    "dvc-gs>=3.0.2",
    "evidently>=0.6.0",
    "fastapi==0.115.6",
    "google-api-python-client>=2.196.0",
    "google-cloud-storage>=3.10.1",
    "hydra-core>=1.3.2",
    "invoke>=2.2.0",
    "loguru>=0.7.3",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "python-multipart>=0.0.32",
    "pytorch-lightning>=2.6.5",
    "requests>=2.34.2",
    "torch",
    "torchvision",
    "typer>=0.16.0",
    "ultralytics>=8.4.51",
    "uvicorn==0.49.0",
    "wandb>=0.27.0",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "pre-commit==4.1.0",
    "pytest==9.0.3",
    "ruff==0.1.3",
    "mypy==1.19.1",
    "mkdocs-material==9.7.1",
    "mkdocstrings-python==2.0.1",
    "openpyxl>=3.1.5",
    "dvc>=3.67.1",
    "dvc-gs>=3.0.2",
    "snakeviz>=2.2.2",
    "httpx>=0.28.1",
    "locust>=2.44.4",
]


[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"
lint.select = [
  "E", # Errors in formatting
  "W", # Warnings in formatting
  "I", # Import Sorting
  "B", # BugBear likly bugs / bad patterns
  "NPY", # NumPy specific rules
  "PD" # Pandas specific rules
]
lint.ignore = [
  "E501", # Lint line length handled by formatter
  "W505", # ignore doc/comment line length
]

[tool.ruff.lint.isort]    #lokalem ruff sagen, dass wandb von einer third party ist, weil er das aktuell anders einstuft
known-third-party = ["wandb"]

[tool.coverage.run]
omit = ["tests/*"]
